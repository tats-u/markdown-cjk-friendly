packages:
  - packages/*
  - integration_tests
  - demos/*
  - website

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true

audit:
  ignore:
    # Withdrawn advisory: https://github.com/github/advisory-database/pull/11056
    - GHSA-gcqx-w48m-w2h4

blockExoticSubdeps: true

catalog:
  '@astrojs/markdown-remark': ^7.3.1
  '@astrojs/mdx': ^7.0.8
  '@mdx-js/mdx': ^3.1.1
  '@rspress/core>remark-cjk-friendly': 'workspace:'
  '@rspress/core>remark-cjk-friendly-gfm-strikethrough': 'workspace:'
  '@types/mdast': ^4.0.4
  '@types/node': ^24.19.0
  astro: ^7.3.5
  devlop: ^1.1.0
  get-east-asian-width: ^1.7.0
  markdown-it: ^15.0.3
  mdast-util-from-markdown: ^2.0.3
  micromark: ^4.0.3
  micromark-extension-gfm: ^3.0.0
  micromark-util-chunked: ^2.0.1
  micromark-util-resolve-all: ^2.0.1
  micromark-util-symbol: ^2.0.1
  micromark-util-types: ^2.0.3
  npm-run-all2: ^8.0.4
  rehype-stringify: ^10.0.1
  remark: ^15.0.1
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  remark-rehype: ^11.1.2
  tsdown: ^0.22.14
  unified: ^11.0.5
dedupePeers: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@types/markdown-it@14.2.0"

overrides:
  # Tinypool 2 drops Node 18; Docusaurus uses compatible worker APIs on Node 22+.
  '@docusaurus/core@^3.10.2>tinypool@^1': ^2.2.0
  ajv@^8.20.0>fast-uri@^3: ^3.1.9
  compression@1.8.0>on-headers: 1.1.0
  gray-matter@^4: "npm:@11ty/gray-matter@^2.1.0"
  react-render-to-markdown@>=19 <19.1.0: ^19.1.0
  refractor@3.6.0>prismjs: ^1.30.0
  # Node 18 has been discarded since 7.x but not affected because 6.x is only used by example sites
  serialize-javascript@^6: ^7.0.4
  serve-handler@6.1.6>minimatch: ^3.1.3
  unstorage>@azure/identity: "-"
  # This demo uses none of Vite 6's removed APIs; plugin-vue 5 also supports Vite 6.
  vitepress@^1.6.4>vite@^5: ^6.4.5
  webpack-dev-server@^5>sockjs: "-" # Unsed by default: https://github.com/webpack/webpack-dev-server/issues/5662#issuecomment-4448722673

publicHoistPattern:
  - decode-named-character-reference
trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.1
trustPolicyIgnoreAfter: 43200
